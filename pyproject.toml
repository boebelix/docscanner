[project]
name = "boebelix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "img2pdf>=0.6.3",
    "python-dotenv>=1.2.2",
    "wand>=0.7.1",
    "watchdog>=6.0.0",
    "python-sane>=2.9.1",
]

[project.scripts]
docscanner = "de.boebelix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de"]
